<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Central Emblem / Wallet & Voice Sparkle -->
  <g filter="url(#shadow)">
    <!-- Wallet base -->
    <path d="M120 180 C120 152 142 130 170 130 L350 130 C372 130 390 148 390 170 L390 180 Z" fill="#047857" opacity="0.6" />
    <rect x="110" y="170" width="292" height="200" rx="36" fill="#ffffff" />

    <!-- Wallet flap & clasp -->
    <path d="M110 210 Q256 250 402 210 L402 180 Q256 220 110 180 Z" fill="#ecfdf5" />
    
    <!-- Accent Bar -->
    <rect x="290" y="240" width="112" height="60" rx="18" fill="url(#accentGrad)" />
    <circle cx="346" cy="270" r="12" fill="#ffffff" />
    
    <!-- Sparkle Stars (AI) -->
    <path d="M210 230 Q210 270 170 270 Q210 270 210 310 Q210 270 250 270 Q210 270 210 230 Z" fill="#047857" />
    <path d="M250 200 Q250 220 230 220 Q250 220 250 240 Q250 220 270 220 Q250 220 250 200 Z" fill="#10b981" />
  </g>

  <!-- Soundwave / Mic arcs at bottom -->
  <g fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round">
    <path d="M190 395 Q256 420 322 395" opacity="0.8" />
    <path d="M216 415 Q256 430 296 415" opacity="0.5" />
  </g>
</svg>
