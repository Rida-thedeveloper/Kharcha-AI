<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        const _origErr = console.error;
        console.error = function(...args) {
          if (args.some(arg => {
            const str = arg instanceof Error ? arg.message : String(arg || '');
            return str.includes('WebSocket closed without opened') || (str.includes('WebSocket') && str.includes('closed'));
          })) {
            return;
          }
          _origErr.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (e.message && e.message.includes('WebSocket closed without opened')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
